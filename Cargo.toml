[workspace]
members = ["ui_core", "ui_sim"]
# `cargo build` from the root builds only the MCU binary.
# For the host simulator: `cd ui_sim && cargo run`
default-members = ["."]

[package]
name = "stm32f767_od"
version = "0.1.0"
edition = "2024"

[dependencies]
ui_core = { path = "ui_core" }
embassy-stm32 = { version = "0.6.0", features = ["stm32f767zi", "unstable-pac", "memory-x", "time-driver-tim4", "exti", "chrono", "single-bank"] }

# Embedded HAL utilities
embassy-embedded-hal = { version = "0.6.0", features = [] }

# Synchronization primitives and data structures with async support
embassy-sync = { version = "0.8.0", features = [] }

# Async/await executor
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }

# Utilities for working with futures, compatible with no_std and not using alloc
embassy-futures = "0.1.2"

# Timekeeping, delays and timeouts
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }

# USB device
# embassy-usb = { version = "0.6.0", git = "https://github.com/embassy-rs/embassy", rev = "3e8d8fe", features = [] }

# Defmt support
defmt = "1.0.1"
defmt-rtt = "1.1.0"

# Low level access to Cortex-M processors
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }

# Boostrap crate for Cortex-M Processors
cortex-m-rt = "0.7.5"

# Panic handler that exits `probe-run` with an error code
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
grounded = "0.2.1"
micromath = "2.1.0"

cmsis_dsp_sys_pregenerated = { version = "0.1.0", features = ["cortex-m7", "double-precision-fpu"] }

embedded-graphics = "0.8"
embedded-hal-bus = { version = "0.3", features = ["async"] }
display-interface-spi = "0.5"
oled_async = { version = "0.2.1", features = ["spi"] }

[profile.dev]
opt-level = 3
debug = 2
